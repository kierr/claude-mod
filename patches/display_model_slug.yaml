id: "display_model_slug"
target: "claude-code"
name: "Show Model Slugs in Selection Menu"
description: "Show the real API model slug for all model options in the selection menu"
file_id: "cli"

status_tests:
  # applied: mod guard for this patch is present in the output
  applied: '__isModEnabled__\(\s*["\x27]display_model_slug["\x27]\s*\)'
  # Accept quoted or template descriptions and literal or escaped middle dots,
  # or underscores (engine replaces Unicode middle dots with _ before Babel parse).
  # The injected slug changes this shape, so it does not rematch patched output.
  applicable: 'Sonnet 4\.6 (?:\\xB7|·|_) (?:Best for everyday tasks|\$\{)'

codemod:
  type: "node_script"
  engine: "regex"
  script: "codemods/codemod-display-model-slug.cjs"


order: 10

mod:
  live: true
  category: "model"
