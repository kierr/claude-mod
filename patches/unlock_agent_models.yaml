id: "unlock_agent_models"
target: "claude-code"
name: "Custom Models in Agent Tool"
description: "Allow any model name in the Agent tool and show provider models in the parameter description."
file_id: "cli"
order: 5

status_tests:
  applied: '__isModEnabled__\(\s*["\x27]unlock_agent_models["\x27]\s*\)'
  # Mirror what model-enum-to-string actually matches: a `model:` property whose
  # enum contains at least sonnet/opus/haiku, chained to .optional(). Intentionally
  # does NOT depend on the .describe() text or its quote char — upstream switched
  # " -> ` in 2.1.178 and rewrites the describe text often, which previously made
  # this test (and the whole patch) silently not-applicable. The enum+.optional()
  # shape is the structural contract the codemod relies on, so it is the right anchor.
  applicable: 'model:\s*[\w$]+\.enum\(\["sonnet", "opus", "haiku"[^\]]*\]\)\.optional\(\)'

codemod:
  type: "node_script"
  engine: "regex"
  script: "codemods/codemod-unlock-agent-models.cjs"

mod:
  section: "unlock"
  live: false
  category: "model"
  config:
    # Comma-separated model names surfaced in the Agent tool's model-param
    # description when the mod is enabled (e.g. GLM models routed via a
    # non-Anthropic proxy). Empty = original describe text unchanged.
    - key: "models"
      type: "string"
      default: ""
      label: "Models shown in Agent tool desc (comma-separated, e.g. glm-4.6, glm-5)"
