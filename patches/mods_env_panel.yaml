id: "mods_env_panel"
target: "claude-code"
name: "Environment Tab"
description: "Adds an Environment tab to the /config UI that surfaces all config env vars (curated + discovered) with resolved value, source layer (managed/user/env/default), restart-required badge, in-place editing (user settings.json default; managed via macOS Touch ID), and a recommendations panel. Core substrate, like mods_ui."
file_id: "cli"
order: 98

status_tests:
