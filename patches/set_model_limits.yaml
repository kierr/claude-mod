id: "set_model_limits"
target: "claude-code"
name: "Per-Model Limits (model-capabilities.json)"
description: >-
  Resolve per-model context window and max output-token limits live from
  ~/.claude/cache/model-capabilities.json. Injects a 2s-TTL reader
  (__modelCaps__) that consults getModelMaxOutputTokens (CXH, output) and
  getContextWindowForModel (w37, context), mod-guarded. Entries use the K37
  schema {id, max_input_tokens?, max_tokens?} (aliases context_window / max_output
  / limit.input / limit.output also accepted). The user/gateway populates the
  file; the patch only reads it — editing takes effect within ~2s with no
  restart or re-patch. Lets opus get 1M/128K while sonnet/haiku keep their own
  limits, which global env vars (CLAUDE_CONTEXT_LIMIT / CLAUDE_CODE_MAX_OUTPUT_TOKENS)
  cannot do because they apply to every slot. Does not touch z37/$37/Y37, so no
  collision with model_full_list.
file_id: "cli"
order: 60

status_tests:
  # CXH output-override marker. The context override (model_limits_ctx) uses the
  # extremely stable `return 1000000` anchor (3 occurrences), so it lands whenever
  # the output override does; both are grepped explicitly in verification.
  applied: 'model_limits_out'
  # The unique CXH weave in the baseline: `?.max_tokens && X.max_tokens >= 4096`.
  # Single-occurrence anchor in the 2.1.178 baseline. No [\s\S] -> ReDoS-safe.
  applicable: '\?\s*\.\s*max_tokens\s*&&\s*\w+\s*\.\s*max_tokens\s*>=\s*4096'

codemod:
  type: "node_script"
  engine: "regex"
  script: "codemods/codemod-set-model-limits.cjs"

mod:
  live: true
  category: "model"
